# Skip Netlify builds when the deployable surface didn't change.
# Exit 0 = skip build (saves credits); exit 1 = build.
# Only index.html and netlify/ (functions) affect the deployed site —
# docs, poller, schema, and data scripts never need a rebuild.
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html netlify/"
